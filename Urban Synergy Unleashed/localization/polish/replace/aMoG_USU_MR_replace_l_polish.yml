 # Journals
 je_gaudi_railway_project_reason: "Wasza organizacja „ [concept_tesla_civil_engineer] ” ([GetPlayer.MakeScope.GetCountry.GetCustom('gaudi_dr_engineer_type')] ) rozpoczęła projekt modernizacji linii kolejowych w stanie [GetBuildingType('building_usu_railway_line').GetName], opisany na stronie [GetPlayer.GetName]. Postępy w projekcie będą publikowane co miesiąc. Za każdym razem, gdy postępy osiągną poziom [JournalEntry.GetTotalGoalValue|V0], stan o najsłabszej infrastrukturze otrzyma $tesla_modernized_railway_lines_building_modifier_with_tooltip$ [concept_modifier] .\n\n Aktualny miesięczny postęp: #underline #tooltip:[GetRawTextTooltipTag('gaudi_monthly_civil_research_progress_tt')] [GetPlayer.MakeScope.GetVariable('gaudi_monthly_civil_engineering_progress_var').GetValue|2+] #!#!" #deepl:3888691188
 je_gaudi_new_locomotives_project_reason: "Wasza organizacja „ [concept_tesla_mechanical_engineer] ” ([GetPlayer.MakeScope.GetCountry.GetCustom('gaudi_dr_engineer_type')] ) niestrudzenie pracuje nad budową nowych typów lokomotyw dla [GetPlayer.GetName]. Projekt będzie osiągał postępy co miesiąc. Gdy postępy osiągną poziom [JournalEntry.GetTotalGoalValue|V0] w danym miesiącu, nowe lokomotywy zostaną umieszczone w budynku [GetBuildingType('building_usu_railway_line').GetName]. Budynek o najwyższym poziomie jako pierwszy otrzyma modyfikator. Pasek postępu zresetuje się, gdy wszystkie budynki otrzymają ten modyfikator.\nŁącznie do zdobycia jest 5 modyfikatorów. Każdy nowy modyfikator wymaga ponownego wypełnienia paska postępu.\n\n Aktualny miesięczny postęp: #underline #tooltip:[GetRawTextTooltipTag('gaudi_monthly_mechanical_research_progress_tt')] [GetPlayer.MakeScope.GetVariable('gaudi_monthly_mechanical_engineering_progress_var').GetValue|2+] #!#!" #deepl:4274698333
 gaudi_railways_with_new_locomotives_tt: "Wszystkie budynki z serii „ [GetPlayer.GetAdjective] ” ( [GetBuildingType('building_usu_railway_line').GetName] ) posiadają 5 modyfikatorów.\n – Budynki z pierwszym modyfikatorem: [GetPlayer.MakeScope.GetVariable('gaudi_num_railway_buildings_with_first_modifier_var').GetValue|+0] / [GetPlayer.MakeScope.GetVariable('gaudi_num_railway_buildings_var').GetValue|V0]\n – Budynki z drugim modyfikatorem: [GetPlayer.MakeScope.GetVariable('gaudi_num_railway_buildings_with_second_modifier_var').GetValue|+0] / [GetPlayer.MakeScope.GetVariable('gaudi_num_railway_buildings_var').GetValue|V0]\n – Budynki z trzecim modyfikatorem: [GetPlayer.MakeScope.GetVariable('gaudi_num_railway_buildings_with_third_modifier_var').GetValue|+0] / [GetPlayer.MakeScope.GetVariable('gaudi_num_railway_buildings_var').GetValue|V0]\n – Budynki z czwartym modyfikatorem: [GetPlayer.MakeScope.GetVariable('gaudi_num_railway_buildings_with_fourth_modifier_var').GetValue|+0] / [GetPlayer.MakeScope.GetVariable('gaudi_num_railway_buildings_var').GetValue|V0]\n – Budynki z piątym modyfikatorem: [GetPlayer.MakeScope.GetVariable('gaudi_num_railway_buildings_with_modifiers_var').GetValue|+0] / [GetPlayer.MakeScope.GetVariable('gaudi_num_railway_buildings_var').GetValue|V0]" #deepl:2623591430
 
 # Tooltips
 MR_CIVIL_ENGINEER_INFRASTRUCTURE_TRIGGER_TT: "#default_text Żaden stan w twoim kraju nie posiada pełnej infrastruktury [Concept('concept_modifier','$concept_modifiers$')]. Stan musi posiadać stację kolejową typu „ [GetBuildingType('building_usu_railway_line').GetName] ”, aby uzyskać modyfikator kolejowy.#!" #deepl:3199767471
 MR_MECHANICAL_ENGINEER_LOCOMOTIVES_BUTTON_TT: "#T Opracuj nowe lokomotywy#!\n Niech Twoja firma [concept_tesla_engineer] skupi się na budowie nowych lokomotyw, które zapewnią premię budynkom [GetBuildingType('building_usu_railway_line').GetName]. Spowoduje to wzrost wydatków #n #! w Twoim kraju.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]" #deepl:4167404043
 MR_MECHANICAL_ENGINEER_LOCOMOTIVES_TRIGGER_TT: "#default_text Co najmniej jeden element typu „ [GetBuildingType('building_usu_railway_line').GetName] ” o poziomie 1 lub wyższym nie posiada wszystkich pięciu elementów lokomotorycznych [Concept('concept_modifier','$concept_modifiers$')].#!" #deepl:1121565009
 MR_CIVIL_ENGINEER_RAILWAY_BUTTON_TT: "#T Projekt kolejowy#!\n Niech Twoja strona [concept_tesla_engineer] skupi się na ulepszaniu [GetBuildingType('building_usu_railway_line').GetName] w [GetPlayer.GetName]. Będziesz mógł ustalać priorytety dla poszczególnych stanów, a linie kolejowe w tych stanach otrzymają $tesla_modernized_railway_lines_building_modifier_with_tooltip$ [concept_modifier] , co poprawi [concept_throughput] budynku.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]" #deepl:2311210078
 MR_CIVIL_ENGINEER_RAILWAY_TRIGGER_TT: "#default_text Strona [GetPlayer.GetName] zawiera link [GetBuildingType('building_usu_railway_line').GetName], w którym brakuje adresu $tesla_modernized_railway_lines_building_modifier_with_tooltip$ [concept_modifier] .#!" #deepl:3743543419
