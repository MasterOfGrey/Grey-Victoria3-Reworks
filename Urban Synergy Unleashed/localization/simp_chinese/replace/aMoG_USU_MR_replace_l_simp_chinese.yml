 # Journals
 je_gaudi_railway_project_reason: "您的“[concept_tesla_civil_engineer] ”（[GetPlayer.MakeScope.GetCountry.GetCustom('gaudi_dr_engineer_type')] ）发起了一项项目，旨在对“[GetBuildingType('building_usu_railway_line').GetName] ”线路进行现代化改造（[GetPlayer.GetName] ）。该项目每月都会有进展。每当进度达到[JournalEntry.GetTotalGoalValue|V0] 时，基础设施最匮乏的州将获得“$tesla_modernized_railway_lines_building_modifier_with_tooltip$ ”（[concept_modifier] ）。\n\n 当前月度进度：#underline #tooltip:[GetRawTextTooltipTag('gaudi_monthly_civil_research_progress_tt')] [GetPlayer.MakeScope.GetVariable('gaudi_monthly_civil_engineering_progress_var').GetValue|2+] #!#!" #deepl:3888691188
 je_gaudi_new_locomotives_project_reason: "您的“[concept_tesla_mechanical_engineer] ”（[GetPlayer.MakeScope.GetCountry.GetCustom('gaudi_dr_engineer_type')] ）正不懈地为“[GetPlayer.GetName] ”制造新型机车。该项目每月都会取得进展。一旦当月的进度达到[JournalEntry.GetTotalGoalValue|V0] ，新型机车将被部署到[GetBuildingType('building_usu_railway_line').GetName] 中的建筑中。等级最高的建筑将最先获得该修饰符。 当所有建筑都获得该修饰符后，进度条将重置。\n总共有 5 个修饰符可获取。每个新修饰符都需要进度条重新填满。\n\n 当前月度进度：#underline #tooltip:[GetRawTextTooltipTag('gaudi_monthly_mechanical_research_progress_tt')] [GetPlayer.MakeScope.GetVariable('gaudi_monthly_mechanical_engineering_progress_var').GetValue|2+] #!#!" #deepl:4274698333
 gaudi_railways_with_new_locomotives_tt: "所有[GetPlayer.GetAdjective] [GetBuildingType('building_usu_railway_line').GetName] 中的建筑都带有 5 个修饰符。\n- 带有第 1 个修饰符的建筑：[GetPlayer.MakeScope.GetVariable('gaudi_num_railway_buildings_with_first_modifier_var').GetValue|+0] /[GetPlayer.MakeScope.GetVariable('gaudi_num_railway_buildings_var').GetValue|V0]\n - 带有第 2 个修饰符的建筑：[GetPlayer.MakeScope.GetVariable('gaudi_num_railway_buildings_with_second_modifier_var').GetValue|+0] /[GetPlayer.MakeScope.GetVariable('gaudi_num_railway_buildings_var').GetValue|V0]\n - 带有第 3 个修饰符的建筑：[GetPlayer.MakeScope.GetVariable('gaudi_num_railway_buildings_with_third_modifier_var').GetValue|+0] /[GetPlayer.MakeScope.GetVariable('gaudi_num_railway_buildings_var').GetValue|V0]\n - 带有第 4 个修饰符的建筑：[GetPlayer.MakeScope.GetVariable('gaudi_num_railway_buildings_with_fourth_modifier_var').GetValue|+0] /[GetPlayer.MakeScope.GetVariable('gaudi_num_railway_buildings_var').GetValue|V0]\n - 带有第 5 个修饰符的建筑：[GetPlayer.MakeScope.GetVariable('gaudi_num_railway_buildings_with_modifiers_var').GetValue|+0] /[GetPlayer.MakeScope.GetVariable('gaudi_num_railway_buildings_var').GetValue|V0]" #deepl:2623591430
 
 # Tooltips
 MR_CIVIL_ENGINEER_INFRASTRUCTURE_TRIGGER_TT: "#default_text 贵国任何一个州都未具备完整的基础设施 [Concept('concept_modifier','$concept_modifiers$')]。一个州需要拥有[GetBuildingType('building_usu_railway_line').GetName] 才能获得铁路修饰符。#!" #deepl:3199767471
 MR_MECHANICAL_ENGINEER_LOCOMOTIVES_BUTTON_TT: "#T 研发新型机车#!\n 让你的[concept_tesla_engineer] 专注于制造新型机车，这些机车将为你的[GetBuildingType('building_usu_railway_line').GetName] 建筑提供加成。这将给你的国家增加#n 开支#! 。\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]" #deepl:4167404043
 MR_MECHANICAL_ENGINEER_LOCOMOTIVES_TRIGGER_TT: "#default_text 至少有一辆1级或更高级别的[GetBuildingType('building_usu_railway_line').GetName] ，其五台机车 [Concept('concept_modifier','$concept_modifiers$')]。#!" #deepl:1121565009
 MR_CIVIL_ENGINEER_RAILWAY_BUTTON_TT: "#T 铁路项目#!\n 让你的[concept_tesla_engineer] 专注于提升[GetBuildingType('building_usu_railway_line').GetName] 在[GetPlayer.GetName] 中的数值。这样你就可以对各州进行优先排序，而这些州的铁路将获得$tesla_modernized_railway_lines_building_modifier_with_tooltip$ [concept_modifier] ，从而提升该建筑的[concept_throughput] 属性。\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]" #deepl:2311210078
 MR_CIVIL_ENGINEER_RAILWAY_TRIGGER_TT: "#default_text[GetPlayer.GetName] 拥有一个[GetBuildingType('building_usu_railway_line').GetName] ，但其中缺少$tesla_modernized_railway_lines_building_modifier_with_tooltip$ [concept_modifier] 。#!" #deepl:3743543419
