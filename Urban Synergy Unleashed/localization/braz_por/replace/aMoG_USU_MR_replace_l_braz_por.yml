 # PMs
 pm_luxury_requisitions: "Requisições de Luxo"
 pm_travel_agencies: "Agências de viagens"
 
 pm_mendelejew_automation_disabled: "Operações manuais"
 pm_pneumatic_transfer_system: "Sistemas de transferência pneumática"
 pm_continuous_process_systems_hydrogenation: "Hidrogenação Contínua"
 pm_continuous_process_systems_polymerisation: "Polimerização Contínua"
 
 # Modifier Types
 building_mendelejew_hydrogenation_plants_throughput_add: "$building_mendelejew_hydrogenation_plants$ edifício [concept_throughput]"
 building_mendelejew_hydrogenation_plants_throughput_add_desc: "Um bônus ou penalidade para entrada e saída de $building_mendelejew_hydrogenation_plants$"
 building_mendelejew_synthetic_rubber_factory_throughput_add: "$building_mendelejew_synthetic_rubber_factory$ edifício [concept_throughput]"
 building_mendelejew_synthetic_rubber_factory_throughput_add_desc: "Um bônus ou penalidade para entrada e saída de $building_mendelejew_synthetic_rubber_factory$"
 
 # Journals
 je_gaudi_railway_project_reason: "O site [concept_tesla_civil_engineer][GetPlayer.MakeScope.GetCountry.GetCustom('gaudi_dr_engineer_type')] iniciou um projeto para modernizar as linhas [GetBuildingType('building_usu_railway_line').GetName] em [GetPlayer.GetName]. O projeto terá atualizações mensais. Sempre que o progresso atingir [JournalEntry.GetTotalGoalValue|V0], o estado com a menor infraestrutura disponível receberá o $tesla_modernized_railway_lines_building_modifier_with_tooltip$ [concept_modifier] .\n\n Progresso mensal atual: #underline #tooltip:[GetRawTextTooltipTag('gaudi_monthly_civil_research_progress_tt')] [GetPlayer.MakeScope.GetVariable('gaudi_monthly_civil_engineering_progress_var').GetValue|2+] #!#!" #deepl:3888691188
 je_gaudi_new_locomotives_project_reason: "O seu [concept_tesla_mechanical_engineer][GetPlayer.MakeScope.GetCountry.GetCustom('gaudi_dr_engineer_type')] está trabalhando incansavelmente para construir novos tipos de locomotivas para [GetPlayer.GetName]. O projeto terá progresso a cada mês. Assim que o progresso atingir [JournalEntry.GetTotalGoalValue|V0] a cada mês, as novas locomotivas serão enviadas para um prédio em [GetBuildingType('building_usu_railway_line').GetName]. O prédio com o nível mais alto receberá o modificador primeiro. A barra de progresso será reiniciada assim que todos os edifícios tiverem esse modificador.\nHá um total de 5 modificadores a serem conquistados. Cada novo modificador requer que o progresso seja preenchido novamente.\n\n Progresso mensal atual: #underline #tooltip:[GetRawTextTooltipTag('gaudi_monthly_mechanical_research_progress_tt')] [GetPlayer.MakeScope.GetVariable('gaudi_monthly_mechanical_engineering_progress_var').GetValue|2+] #!#!" #deepl:4274698333
 gaudi_railways_with_new_locomotives_tt: "Todos os [GetPlayer.GetAdjective] [GetBuildingType('building_usu_railway_line').GetName] possuem os 5 modificadores.\n- Edifícios com o 1º modificador: [GetPlayer.MakeScope.GetVariable('gaudi_num_railway_buildings_with_first_modifier_var').GetValue|+0] / [GetPlayer.MakeScope.GetVariable('gaudi_num_railway_buildings_var').GetValue|V0]\n - Edifícios com o 2º modificador: [GetPlayer.MakeScope.GetVariable('gaudi_num_railway_buildings_with_second_modifier_var').GetValue|+0] / [GetPlayer.MakeScope.GetVariable('gaudi_num_railway_buildings_var').GetValue|V0]\n - Edifícios com o 3º modificador: [GetPlayer.MakeScope.GetVariable('gaudi_num_railway_buildings_with_third_modifier_var').GetValue|+0] / [GetPlayer.MakeScope.GetVariable('gaudi_num_railway_buildings_var').GetValue|V0]\n - Edifícios com o 4º modificador: [GetPlayer.MakeScope.GetVariable('gaudi_num_railway_buildings_with_fourth_modifier_var').GetValue|+0] / [GetPlayer.MakeScope.GetVariable('gaudi_num_railway_buildings_var').GetValue|V0]\n - Edifícios com o 5º modificador: [GetPlayer.MakeScope.GetVariable('gaudi_num_railway_buildings_with_modifiers_var').GetValue|+0] / [GetPlayer.MakeScope.GetVariable('gaudi_num_railway_buildings_var').GetValue|V0]" #deepl:2623591430
 
 # Tooltips
 MR_CIVIL_ENGINEER_INFRASTRUCTURE_TRIGGER_TT: "#default_text Nenhum estado do seu país possui toda a infraestrutura [Concept('concept_modifier','$concept_modifiers$')]. Um estado precisa de um “ [GetBuildingType('building_usu_railway_line').GetName] ” para obter o modificador ferroviário.#!" #deepl:3199767471
 MR_MECHANICAL_ENGINEER_LOCOMOTIVES_BUTTON_TT: "#T Desenvolva novas locomotivas#!\n Faça com que seu [concept_tesla_engineer] se concentre na construção de novas locomotivas que darão um bônus aos seus edifícios [GetBuildingType('building_usu_railway_line').GetName]. Isso aumentará as despesas #n #! do seu país.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]" #deepl:4167404043
 MR_MECHANICAL_ENGINEER_LOCOMOTIVES_TRIGGER_TT: "#default_text Pelo menos uma “ [GetBuildingType('building_usu_railway_line').GetName] ” de nível 1 ou superior não possui todas as cinco locomotivas [Concept('concept_modifier','$concept_modifiers$')].#!" #deepl:1121565009
 MR_CIVIL_ENGINEER_RAILWAY_BUTTON_TT: "#T Projeto Ferroviário#!\n Deixe que seu [concept_tesla_engineer] se concentre em melhorar o [GetBuildingType('building_usu_railway_line').GetName] em [GetPlayer.GetName]. Você poderá priorizar os estados, e as ferrovias desses estados receberão o $tesla_modernized_railway_lines_building_modifier_with_tooltip$ [concept_modifier] , o que melhora o [concept_throughput] da construção.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]" #deepl:2311210078
 MR_CIVIL_ENGINEER_RAILWAY_TRIGGER_TT: "#default_text O site [GetPlayer.GetName] possui um link [GetBuildingType('building_usu_railway_line').GetName] sem o endereço $tesla_modernized_railway_lines_building_modifier_with_tooltip$ [concept_modifier] .#!" #deepl:3743543419
