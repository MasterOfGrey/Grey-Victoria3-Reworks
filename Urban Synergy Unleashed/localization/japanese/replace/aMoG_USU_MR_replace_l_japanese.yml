 # Journals
 je_gaudi_railway_project_reason: "[concept_tesla_civil_engineer] （[GetPlayer.MakeScope.GetCountry.GetCustom('gaudi_dr_engineer_type')] ）は、[GetBuildingType('building_usu_railway_line').GetName] の路線を近代化するプロジェクトを[GetPlayer.GetName] で開始しました。このプロジェクトの進捗状況は毎月更新されます。進捗が[JournalEntry.GetTotalGoalValue|V0] に達するたびに、利用可能なインフラが最も少ない州に$tesla_modernized_railway_lines_building_modifier_with_tooltip$ （[concept_modifier] ）が授与されます。\n\n 現在の月間進捗状況：#underline #tooltip:[GetRawTextTooltipTag('gaudi_monthly_civil_research_progress_tt')] [GetPlayer.MakeScope.GetVariable('gaudi_monthly_civil_engineering_progress_var').GetValue|2+] #!#!" #deepl:3888691188
 je_gaudi_new_locomotives_project_reason: "[concept_tesla_mechanical_engineer] （[GetPlayer.MakeScope.GetCountry.GetCustom('gaudi_dr_engineer_type')] ）は、[GetPlayer.GetName] 向けに新しいタイプの機関車を開発するために、たゆまぬ努力を続けています。このプロジェクトは毎月進捗を記録します。毎月の進捗が[JournalEntry.GetTotalGoalValue|V0] に達すると、新しい機関車が[GetBuildingType('building_usu_railway_line').GetName] の建物に配備されます。レベルが最も高い建物が、そのモディファイアを最初に獲得します。 すべての建物がそのモディファイアを獲得すると、進行状況バーはリセットされます。\n獲得可能なモディファイアは全部で5つあります。新しいモディファイアを獲得するには、進行状況を再び満たす必要があります。\n\n 現在の月間進行状況：#underline #tooltip:[GetRawTextTooltipTag('gaudi_monthly_mechanical_research_progress_tt')] [GetPlayer.MakeScope.GetVariable('gaudi_monthly_mechanical_engineering_progress_var').GetValue|2+] #!#!" #deepl:4274698333
 gaudi_railways_with_new_locomotives_tt: "[GetPlayer.GetAdjective] （[GetBuildingType('building_usu_railway_line').GetName] ）のすべての建物には、5つの修飾子があります。\n- 第1の修飾子を持つ建物：[GetPlayer.MakeScope.GetVariable('gaudi_num_railway_buildings_with_first_modifier_var').GetValue|+0] /[GetPlayer.MakeScope.GetVariable('gaudi_num_railway_buildings_var').GetValue|V0]\n - 第2の修飾子を持つ建物：[GetPlayer.MakeScope.GetVariable('gaudi_num_railway_buildings_with_second_modifier_var').GetValue|+0] /[GetPlayer.MakeScope.GetVariable('gaudi_num_railway_buildings_var').GetValue|V0]\n - 第3の修飾子を持つ建物：[GetPlayer.MakeScope.GetVariable('gaudi_num_railway_buildings_with_third_modifier_var').GetValue|+0] /[GetPlayer.MakeScope.GetVariable('gaudi_num_railway_buildings_var').GetValue|V0]\n - 第4の修飾子を持つ建物：[GetPlayer.MakeScope.GetVariable('gaudi_num_railway_buildings_with_fourth_modifier_var').GetValue|+0] /[GetPlayer.MakeScope.GetVariable('gaudi_num_railway_buildings_var').GetValue|V0]\n - 第5の修飾子を持つ建物：[GetPlayer.MakeScope.GetVariable('gaudi_num_railway_buildings_with_modifiers_var').GetValue|+0] /[GetPlayer.MakeScope.GetVariable('gaudi_num_railway_buildings_var').GetValue|V0]" #deepl:2623591430
 
 # Tooltips
 MR_CIVIL_ENGINEER_INFRASTRUCTURE_TRIGGER_TT: "#default_text あなたの国のどの州も、必要なインフラをすべて備えていません [Concept('concept_modifier','$concept_modifiers$')]。州が「鉄道」モディファイアを獲得するには、[GetBuildingType('building_usu_railway_line').GetName] が必要です。#!" #deepl:3199767471
 MR_MECHANICAL_ENGINEER_LOCOMOTIVES_BUTTON_TT: "#T 新しい機関車を開発する#!\n [concept_tesla_engineer] に、[GetBuildingType('building_usu_railway_line').GetName] の建物にボーナスを与える新しい機関車の製造に専念させましょう。これにより、#n の費用#! が国に追加されます。\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]" #deepl:4167404043
 MR_MECHANICAL_ENGINEER_LOCOMOTIVES_TRIGGER_TT: "#default_text レベル1以上の[GetBuildingType('building_usu_railway_line').GetName] のうち、少なくとも1つが5つのロコモティブ [Concept('concept_modifier','$concept_modifiers$')]。#!" #deepl:1121565009
 MR_CIVIL_ENGINEER_RAILWAY_BUTTON_TT: "#T 鉄道プロジェクト#!\n 「[concept_tesla_engineer] 」を、[GetPlayer.GetName] にある「[GetBuildingType('building_usu_railway_line').GetName] 」の改良に集中させましょう。そうすることで、各州に優先順位をつけることができ、その州の鉄道には「$tesla_modernized_railway_lines_building_modifier_with_tooltip$ 」[concept_modifier] が付与され、建物の「[concept_throughput] 」が向上します。\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]" #deepl:2311210078
 MR_CIVIL_ENGINEER_RAILWAY_TRIGGER_TT: "#default_text[GetPlayer.GetName] には、$tesla_modernized_railway_lines_building_modifier_with_tooltip$ [concept_modifier] を除いた[GetBuildingType('building_usu_railway_line').GetName] が記載されています。#!" #deepl:3743543419
