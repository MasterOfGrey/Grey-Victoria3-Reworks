l_french:
 # Tooltips 
 mr_airport_can_construct_tt: "Le niveau maximum de [Concept('concept_curtiss_airport','$concept_curtiss_airports$')] qu'un État peut supporter est égal à 1 plus 1 pour chaque #G 10 niveaux#! de [GetBuildingType('building_urban_center').GetName]." #deepl:1884813676
 
 # PMGs
 pmg_tourism_airport: "Importations et tourisme"
 pmg_mendelejew_automation_oil: "Automation"
 pmg_mendelejew_automation_rubber: "Automation"
 
 # PMs
 pm_luxury_requisitions: "Réquisitions de luxe"
 pm_travel_agencies: "Agences de voyages"
 
 pm_mendelejew_automation_disabled: "Opérations manuelles"
 pm_pneumatic_transfer_system: "Systèmes de transfert pneumatique"
 pm_continuous_process_systems_hydrogenation: "Hydrogénation continue"
 pm_continuous_process_systems_polymerisation: "Polymérisation continue"
 
 # Modifier Types
 building_mendelejew_hydrogenation_plants_throughput_add: "$building_mendelejew_hydrogenation_plants$ bâtiment [concept_throughput]"
 building_mendelejew_hydrogenation_plants_throughput_add_desc: "Un bonus ou une pénalité à l'entrée et à la sortie de $building_mendelejew_hydrogenation_plants$"
 building_mendelejew_synthetic_rubber_factory_throughput_add: "$building_mendelejew_synthetic_rubber_factory$ bâtiment [concept_throughput]"
 building_mendelejew_synthetic_rubber_factory_throughput_add_desc: "Un bonus ou une pénalité à l'entrée et à la sortie de $building_mendelejew_synthetic_rubber_factory$"
 
 # Journals
 je_gaudi_railway_project_reason: "Votre [concept_tesla_civil_engineer][GetPlayer.MakeScope.GetCountry.GetCustom('gaudi_dr_engineer_type')] a lancé un projet visant à moderniser les lignes [GetBuildingType('building_usu_railway_line').GetName] sur [GetPlayer.GetName]. Le projet fera l'objet d'un bilan mensuel. Chaque fois que les travaux auront progressé jusqu'à [JournalEntry.GetTotalGoalValue|V0], l'État disposant de l'infrastructure la moins développée se verra attribuer le $tesla_modernized_railway_lines_building_modifier_with_tooltip$ [concept_modifier] .\n\n État d'avancement mensuel actuel : #underline #tooltip:[GetRawTextTooltipTag('gaudi_monthly_civil_research_progress_tt')] [GetPlayer.MakeScope.GetVariable('gaudi_monthly_civil_engineering_progress_var').GetValue|2+] #!#!" #deepl:3888691188
 je_gaudi_new_locomotives_project_reason: "Votre [concept_tesla_mechanical_engineer][GetPlayer.MakeScope.GetCountry.GetCustom('gaudi_dr_engineer_type')] travaille sans relâche à la construction de nouveaux types de locomotives pour [GetPlayer.GetName]. Le projet progressera chaque mois. Dès que la barre de progression atteindra [JournalEntry.GetTotalGoalValue|V0] chaque mois, les nouvelles locomotives seront déployées dans un bâtiment de [GetBuildingType('building_usu_railway_line').GetName]. Le bâtiment ayant atteint le niveau le plus élevé recevra le modificateur en premier. La barre de progression sera réinitialisée une fois que tous les bâtiments disposeront de ce modificateur.\nIl y a au total 5 modificateurs à obtenir. Chaque nouveau modificateur nécessite que la barre de progression soit à nouveau remplie.\n\n Progression mensuelle actuelle : #underline #tooltip :[GetRawTextTooltipTag('gaudi_monthly_mechanical_research_progress_tt')] [GetPlayer.MakeScope.GetVariable('gaudi_monthly_mechanical_engineering_progress_var').GetValue|2+] #!#!" #deepl:4274698333
 gaudi_railways_with_new_locomotives_tt: "Tous les [GetPlayer.GetAdjective] [GetBuildingType('building_usu_railway_line').GetName] possèdent les 5 modificateurs.\n- Bâtiments avec le 1er modificateur : [GetPlayer.MakeScope.GetVariable('gaudi_num_railway_buildings_with_first_modifier_var').GetValue|+0] / [GetPlayer.MakeScope.GetVariable('gaudi_num_railway_buildings_var').GetValue|V0]\n - Bâtiments avec le 2e modificateur : [GetPlayer.MakeScope.GetVariable('gaudi_num_railway_buildings_with_second_modifier_var').GetValue|+0] / [GetPlayer.MakeScope.GetVariable('gaudi_num_railway_buildings_var').GetValue|V0]\n - Bâtiments avec le 3e modificateur : [GetPlayer.MakeScope.GetVariable('gaudi_num_railway_buildings_with_third_modifier_var').GetValue|+0] / [GetPlayer.MakeScope.GetVariable('gaudi_num_railway_buildings_var').GetValue|V0]\n - Bâtiments avec le 4e modificateur : [GetPlayer.MakeScope.GetVariable('gaudi_num_railway_buildings_with_fourth_modifier_var').GetValue|+0] / [GetPlayer.MakeScope.GetVariable('gaudi_num_railway_buildings_var').GetValue|V0]\n - Bâtiments avec le 5e modificateur : [GetPlayer.MakeScope.GetVariable('gaudi_num_railway_buildings_with_modifiers_var').GetValue|+0] / [GetPlayer.MakeScope.GetVariable('gaudi_num_railway_buildings_var').GetValue|V0]" #deepl:2623591430
 
 # Tooltips
 MR_CIVIL_ENGINEER_INFRASTRUCTURE_TRIGGER_TT: "#default_text Si un État de votre pays ne dispose pas de toutes les infrastructures nécessaires [Concept('concept_modifier','$concept_modifiers$')]. Un État doit disposer d’une « [GetBuildingType('building_usu_railway_line').GetName] » pour obtenir le modificateur ferroviaire.#!" #deepl:3199767471
 MR_MECHANICAL_ENGINEER_LOCOMOTIVES_BUTTON_TT: "#T Développez de nouvelles locomotives#!\n Concentrez votre [concept_tesla_engineer] sur la construction de nouvelles locomotives qui apporteront un bonus à vos bâtiments [GetBuildingType('building_usu_railway_line').GetName]. Cela entraînera des dépenses #n #! pour votre pays.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]" #deepl:4167404043
 MR_MECHANICAL_ENGINEER_LOCOMOTIVES_TRIGGER_TT: "#default_text Au moins un [GetBuildingType('building_usu_railway_line').GetName] de niveau 1 ou supérieur ne dispose pas des cinq locomoteurs [Concept('concept_modifier','$concept_modifiers$')].#!" #deepl:1121565009
 MR_CIVIL_ENGINEER_RAILWAY_BUTTON_TT: "#T Projet ferroviaire#!\n Concentrez vos efforts [concept_tesla_engineer] sur l'amélioration de la [GetBuildingType('building_usu_railway_line').GetName] dans [GetPlayer.GetName]. Vous pourrez établir un ordre de priorité entre les États, et les chemins de fer de ces États bénéficieront de la $tesla_modernized_railway_lines_building_modifier_with_tooltip$ [concept_modifier] , ce qui améliorera la [concept_throughput] du bâtiment.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]" #deepl:2311210078
 MR_CIVIL_ENGINEER_RAILWAY_TRIGGER_TT: "#default_text Le site [GetPlayer.GetName] dispose d'une page « [GetBuildingType('building_usu_railway_line').GetName] » (sans le lien $tesla_modernized_railway_lines_building_modifier_with_tooltip$ ) : [concept_modifier].#!" #deepl:3743543419
