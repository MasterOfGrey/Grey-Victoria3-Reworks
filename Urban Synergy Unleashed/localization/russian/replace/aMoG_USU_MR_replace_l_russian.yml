 # Journals
 je_gaudi_railway_project_reason: "Ваш сайт [concept_tesla_civil_engineer][GetPlayer.MakeScope.GetCountry.GetCustom('gaudi_dr_engineer_type')] запустил проект по модернизации линий [GetBuildingType('building_usu_railway_line').GetName] на сайте [GetPlayer.GetName]. Проект будет демонстрировать прогресс каждый месяц. Каждый раз, когда прогресс достигнет отметки [JournalEntry.GetTotalGoalValue|V0], штат с наименее развитой инфраструктурой получит $tesla_modernized_railway_lines_building_modifier_with_tooltip$ [concept_modifier] .\n\n Текущий ежемесячный прогресс: #underline #tooltip:[GetRawTextTooltipTag('gaudi_monthly_civil_research_progress_tt')] [GetPlayer.MakeScope.GetVariable('gaudi_monthly_civil_engineering_progress_var').GetValue|2+] #!#!" #deepl:3888691188
 je_gaudi_new_locomotives_project_reason: "Ваш проект « [concept_tesla_mechanical_engineer] » ([GetPlayer.MakeScope.GetCountry.GetCustom('gaudi_dr_engineer_type')] ) неустанно работает над созданием новых типов локомотивов для сайта [GetPlayer.GetName]. Прогресс проекта будет фиксироваться ежемесячно. Как только прогресс достигнет отметки [JournalEntry.GetTotalGoalValue|V0] каждый месяц, новые локомотивы будут размещены в здании [GetBuildingType('building_usu_railway_line').GetName]. Здание с самым высоким уровнем получит модификатор первым. Индикатор прогресса сбрасывается, как только все здания получат данный модификатор.\nВсего можно получить 5 модификаторов. Для получения каждого нового модификатора необходимо снова заполнить индикатор прогресса.\n\n Текущий ежемесячный прогресс: #underline #tooltip:[GetRawTextTooltipTag('gaudi_monthly_mechanical_research_progress_tt')] [GetPlayer.MakeScope.GetVariable('gaudi_monthly_mechanical_engineering_progress_var').GetValue|2+] #!#!" #deepl:4274698333
 gaudi_railways_with_new_locomotives_tt: "Все здания [GetPlayer.GetAdjective] [GetBuildingType('building_usu_railway_line').GetName] имеют 5 модификаторов.\n — Здания с 1-м модификатором: [GetPlayer.MakeScope.GetVariable('gaudi_num_railway_buildings_with_first_modifier_var').GetValue|+0] / [GetPlayer.MakeScope.GetVariable('gaudi_num_railway_buildings_var').GetValue|V0]\n — Здания со 2-м модификатором: [GetPlayer.MakeScope.GetVariable('gaudi_num_railway_buildings_with_second_modifier_var').GetValue|+0] / [GetPlayer.MakeScope.GetVariable('gaudi_num_railway_buildings_var').GetValue|V0]\n — Здания с 3-м модификатором: [GetPlayer.MakeScope.GetVariable('gaudi_num_railway_buildings_with_third_modifier_var').GetValue|+0] / [GetPlayer.MakeScope.GetVariable('gaudi_num_railway_buildings_var').GetValue|V0]\n — Здания с 4-м модификатором: [GetPlayer.MakeScope.GetVariable('gaudi_num_railway_buildings_with_fourth_modifier_var').GetValue|+0] / [GetPlayer.MakeScope.GetVariable('gaudi_num_railway_buildings_var').GetValue|V0]\n — Здания с 5-м модификатором: [GetPlayer.MakeScope.GetVariable('gaudi_num_railway_buildings_with_modifiers_var').GetValue|+0] / [GetPlayer.MakeScope.GetVariable('gaudi_num_railway_buildings_var').GetValue|V0]" #deepl:2623591430
 
 # Tooltips
 MR_CIVIL_ENGINEER_INFRASTRUCTURE_TRIGGER_TT: "#default_text В любом штате вашей страны отсутствует вся необходимая инфраструктура [Concept('concept_modifier','$concept_modifiers$')]. Штат должен иметь « [GetBuildingType('building_usu_railway_line').GetName] », чтобы получить модификатор «railway».#!" #deepl:3199767471
 MR_MECHANICAL_ENGINEER_LOCOMOTIVES_BUTTON_TT: "#T Разрабатывайте новые локомотивы#!\n Пусть ваши « [concept_tesla_engineer] » сосредоточатся на создании новых локомотивов, которые будут давать бонус вашим зданиям [GetBuildingType('building_usu_railway_line').GetName]. Это увеличит расходы #n #! вашей страны.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]" #deepl:4167404043
 MR_MECHANICAL_ENGINEER_LOCOMOTIVES_TRIGGER_TT: "#default_text По крайней мере один « [GetBuildingType('building_usu_railway_line').GetName] » уровня 1 или выше не имеет всех пяти локомотивных [Concept('concept_modifier','$concept_modifiers$')].#!" #deepl:1121565009
 MR_CIVIL_ENGINEER_RAILWAY_BUTTON_TT: "#T Железнодорожный проект#!\n Пусть ваш [concept_tesla_engineer] сосредоточится на улучшении [GetBuildingType('building_usu_railway_line').GetName] в [GetPlayer.GetName]. Вы сможете расставить приоритеты по штатам, и железные дороги в этих штатах получат $tesla_modernized_railway_lines_building_modifier_with_tooltip$ [concept_modifier] , что повысит [concept_throughput] здания.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]" #deepl:2311210078
 MR_CIVIL_ENGINEER_RAILWAY_TRIGGER_TT: "#default_text На сайте [GetPlayer.GetName] размещен файл [GetBuildingType('building_usu_railway_line').GetName], в котором отсутствует ссылка $tesla_modernized_railway_lines_building_modifier_with_tooltip$ [concept_modifier] .#!" #deepl:3743543419
