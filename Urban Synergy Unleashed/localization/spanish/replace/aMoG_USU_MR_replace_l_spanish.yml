l_spanish:
 # Tooltips 
 mr_airport_can_construct_tt: "El nivel máximo de [Concept('concept_curtiss_airport','$concept_curtiss_airports$')] que puede soportar un estado es igual a 1 más 1 por cada #G 10 niveles#! de [GetBuildingType('building_urban_center').GetName]." #deepl:1884813676
 
 # PMGs
 pmg_tourism_airport: "Importaciones y turismo"
 pmg_mendelejew_automation_oil: "Automatización"
 pmg_mendelejew_automation_rubber: "Automatización"
 
 # PMs
 pm_luxury_requisitions: "Requisiciones de lujo"
 pm_travel_agencies: "Agencias de viajes"
 
 pm_mendelejew_automation_disabled: "Operaciones manuales"
 pm_pneumatic_transfer_system: "Sistemas de transferencia neumática"
 pm_continuous_process_systems_hydrogenation: "Hidrogenación continua"
 pm_continuous_process_systems_polymerisation: "Polimerización continua"
 
 # Modifier Types
 building_mendelejew_hydrogenation_plants_throughput_add: "$building_mendelejew_hydrogenation_plants$ edificio [concept_throughput]"
 building_mendelejew_hydrogenation_plants_throughput_add_desc: "Una bonificación o penalización tanto a la entrada como a la salida de $building_mendelejew_hydrogenation_plants$"
 building_mendelejew_synthetic_rubber_factory_throughput_add: "$building_mendelejew_synthetic_rubber_factory$ edificio [concept_throughput]"
 building_mendelejew_synthetic_rubber_factory_throughput_add_desc: "Una bonificación o penalización tanto a la entrada como a la salida de $building_mendelejew_synthetic_rubber_factory$"
 
 # Journals
 je_gaudi_railway_project_reason: "Tu [concept_tesla_civil_engineer][GetPlayer.MakeScope.GetCountry.GetCustom('gaudi_dr_engineer_type')] ha puesto en marcha un proyecto para modernizar las líneas de [GetBuildingType('building_usu_railway_line').GetName] en [GetPlayer.GetName]. El proyecto registrará avances cada mes. Cada vez que el progreso alcance [JournalEntry.GetTotalGoalValue|V0], la región con menos infraestructura disponible recibirá el $tesla_modernized_railway_lines_building_modifier_with_tooltip$ [concept_modifier] .\n\n Progreso mensual actual: #underline #tooltip:[GetRawTextTooltipTag('gaudi_monthly_civil_research_progress_tt')] [GetPlayer.MakeScope.GetVariable('gaudi_monthly_civil_engineering_progress_var').GetValue|2+] #!#!" #deepl:3888691188
 je_gaudi_new_locomotives_project_reason: "Tu [concept_tesla_mechanical_engineer][GetPlayer.MakeScope.GetCountry.GetCustom('gaudi_dr_engineer_type')] trabaja sin descanso para construir nuevos tipos de locomotoras para [GetPlayer.GetName]. El proyecto avanzará cada mes. Una vez que el progreso alcance [JournalEntry.GetTotalGoalValue|V0] cada mes, las nuevas locomotoras se enviarán a un edificio de [GetBuildingType('building_usu_railway_line').GetName]. El edificio con el nivel más alto será el primero en obtener el modificador. La barra de progreso se reiniciará una vez que todos los edificios tengan ese modificador.\nHay un total de 5 modificadores que se pueden conseguir. Cada nuevo modificador requiere que el progreso se vuelva a completar.\n\n Progreso mensual actual: #underline #tooltip:[GetRawTextTooltipTag('gaudi_monthly_mechanical_research_progress_tt')] [GetPlayer.MakeScope.GetVariable('gaudi_monthly_mechanical_engineering_progress_var').GetValue|2+] #!#!" #deepl:4274698333
 gaudi_railways_with_new_locomotives_tt: "Todos los [GetPlayer.GetAdjective] [GetBuildingType('building_usu_railway_line').GetName] cuentan con los 5 modificadores.\n- Edificios con el primer modificador: [GetPlayer.MakeScope.GetVariable('gaudi_num_railway_buildings_with_first_modifier_var').GetValue|+0] / [GetPlayer.MakeScope.GetVariable('gaudi_num_railway_buildings_var').GetValue|V0]\n - Edificios con el segundo modificador: [GetPlayer.MakeScope.GetVariable('gaudi_num_railway_buildings_with_second_modifier_var').GetValue|+0] / [GetPlayer.MakeScope.GetVariable('gaudi_num_railway_buildings_var').GetValue|V0]\n - Edificios con el tercer modificador: [GetPlayer.MakeScope.GetVariable('gaudi_num_railway_buildings_with_third_modifier_var').GetValue|+0] / [GetPlayer.MakeScope.GetVariable('gaudi_num_railway_buildings_var').GetValue|V0]\n - Edificios con el cuarto modificador: [GetPlayer.MakeScope.GetVariable('gaudi_num_railway_buildings_with_fourth_modifier_var').GetValue|+0] / [GetPlayer.MakeScope.GetVariable('gaudi_num_railway_buildings_var').GetValue|V0]\n - Edificios con el quinto modificador: [GetPlayer.MakeScope.GetVariable('gaudi_num_railway_buildings_with_modifiers_var').GetValue|+0] / [GetPlayer.MakeScope.GetVariable('gaudi_num_railway_buildings_var').GetValue|V0]" #deepl:2623591430
 
 # Tooltips
 MR_CIVIL_ENGINEER_INFRASTRUCTURE_TRIGGER_TT: "#default_text Ningún estado de tu país cuenta con toda la infraestructura [Concept('concept_modifier','$concept_modifiers$')]. Un estado necesita un « [GetBuildingType('building_usu_railway_line').GetName] » para obtener el modificador ferroviario.#!" #deepl:3199767471
 MR_MECHANICAL_ENGINEER_LOCOMOTIVES_BUTTON_TT: "#T Desarrolla nuevas locomotoras#!\n Haz que tu [concept_tesla_engineer] se centre en la construcción de nuevas locomotoras que aporten una bonificación a tus edificios [GetBuildingType('building_usu_railway_line').GetName]. Esto supondrá #n gastos#! para tu país.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]" #deepl:4167404043
 MR_MECHANICAL_ENGINEER_LOCOMOTIVES_TRIGGER_TT: "#default_text Al menos una « [GetBuildingType('building_usu_railway_line').GetName] » de nivel 1 o superior no cuenta con las cinco partes de la locomotora [Concept('concept_modifier','$concept_modifiers$')].#!" #deepl:1121565009
 MR_CIVIL_ENGINEER_RAILWAY_BUTTON_TT: "#T Proyecto ferroviario#!\n Deja que tu [concept_tesla_engineer] se centre en mejorar el [GetBuildingType('building_usu_railway_line').GetName] en [GetPlayer.GetName]. Podrás establecer un orden de prioridad entre los estados, y las redes ferroviarias de esos estados obtendrán el $tesla_modernized_railway_lines_building_modifier_with_tooltip$ [concept_modifier] , lo que mejora el [concept_throughput] de la construcción.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]" #deepl:2311210078
 MR_CIVIL_ENGINEER_RAILWAY_TRIGGER_TT: "#default_text [GetPlayer.GetName] tiene un [GetBuildingType('building_usu_railway_line').GetName] sin el $tesla_modernized_railway_lines_building_modifier_with_tooltip$ [concept_modifier] .#!" #deepl:3743543419
