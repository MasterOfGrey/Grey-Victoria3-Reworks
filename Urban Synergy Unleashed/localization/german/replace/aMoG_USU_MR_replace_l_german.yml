 # Journals
 je_gaudi_railway_project_reason: "Dein „ [concept_tesla_civil_engineer] “[GetPlayer.MakeScope.GetCountry.GetCustom('gaudi_dr_engineer_type')] hat ein Projekt zur Modernisierung der „ [GetBuildingType('building_usu_railway_line').GetName] “-Strecken in [GetPlayer.GetName] gestartet. Das Projekt wird jeden Monat Fortschritte verzeichnen. Jedes Mal, wenn der Fortschritt [JournalEntry.GetTotalGoalValue|V0] erreicht, erhält der Bundesstaat mit der am wenigsten verfügbaren Infrastruktur den „ $tesla_modernized_railway_lines_building_modifier_with_tooltip$ “ [concept_modifier].\n\n Aktueller monatlicher Fortschritt: #underline #tooltip:[GetRawTextTooltipTag('gaudi_monthly_civil_research_progress_tt')] [GetPlayer.MakeScope.GetVariable('gaudi_monthly_civil_engineering_progress_var').GetValue|2+] #!#!" #deepl:3888691188
 je_gaudi_new_locomotives_project_reason: "Eure „ [concept_tesla_mechanical_engineer] “ ([GetPlayer.MakeScope.GetCountry.GetCustom('gaudi_dr_engineer_type')] ) arbeitet unermüdlich daran, neue Lokomotivtypen für [GetPlayer.GetName] zu bauen. Das Projekt macht jeden Monat Fortschritte. Sobald der Fortschritt jeden Monat [JournalEntry.GetTotalGoalValue|V0] erreicht, werden die neuen Lokomotiven in einem Gebäude auf [GetBuildingType('building_usu_railway_line').GetName] eingesetzt. Das Gebäude mit der höchsten Stufe erhält den Modifikator als Erstes. Der Fortschrittsbalken wird zurückgesetzt, sobald alle Gebäude diesen Modifikator besitzen.\nInsgesamt gibt es 5 Modifikatoren zu gewinnen. Für jeden neuen Modifikator muss der Fortschrittsbalken erneut aufgefüllt werden.\n\n Aktueller monatlicher Fortschritt: #underline #tooltip:[GetRawTextTooltipTag('gaudi_monthly_mechanical_research_progress_tt')] [GetPlayer.MakeScope.GetVariable('gaudi_monthly_mechanical_engineering_progress_var').GetValue|2+] #!#!" #deepl:4274698333
 gaudi_railways_with_new_locomotives_tt: "Alle [GetPlayer.GetAdjective] [GetBuildingType('building_usu_railway_line').GetName] verfügen über die 5 Modifikatoren.\n – Gebäude mit dem 1. Modifikator: [GetPlayer.MakeScope.GetVariable('gaudi_num_railway_buildings_with_first_modifier_var').GetValue|+0] / [GetPlayer.MakeScope.GetVariable('gaudi_num_railway_buildings_var').GetValue|V0]\n – Gebäude mit dem 2. Modifikator: [GetPlayer.MakeScope.GetVariable('gaudi_num_railway_buildings_with_second_modifier_var').GetValue|+0] / [GetPlayer.MakeScope.GetVariable('gaudi_num_railway_buildings_var').GetValue|V0]\n – Gebäude mit dem 3. Modifikator: [GetPlayer.MakeScope.GetVariable('gaudi_num_railway_buildings_with_third_modifier_var').GetValue|+0] / [GetPlayer.MakeScope.GetVariable('gaudi_num_railway_buildings_var').GetValue|V0]\n – Gebäude mit dem 4. Modifikator: [GetPlayer.MakeScope.GetVariable('gaudi_num_railway_buildings_with_fourth_modifier_var').GetValue|+0] / [GetPlayer.MakeScope.GetVariable('gaudi_num_railway_buildings_var').GetValue|V0]\n – Gebäude mit dem 5. Modifikator: [GetPlayer.MakeScope.GetVariable('gaudi_num_railway_buildings_with_modifiers_var').GetValue|+0] / [GetPlayer.MakeScope.GetVariable('gaudi_num_railway_buildings_var').GetValue|V0]" #deepl:2623591430
 
 # Tooltips
 MR_CIVIL_ENGINEER_INFRASTRUCTURE_TRIGGER_TT: "#default_text Nicht jeder Bundesstaat in Ihrem Land verfügt über die gesamte Infrastruktur [Concept('concept_modifier','$concept_modifiers$')]. Ein Bundesstaat benötigt eine „ [GetBuildingType('building_usu_railway_line').GetName] “, um den Eisenbahn-Modifikator zu erhalten.#!" #deepl:3199767471
 MR_MECHANICAL_ENGINEER_LOCOMOTIVES_BUTTON_TT: "#T Entwickeln Sie neue Lokomotiven#!\n Lassen Sie Ihre „ [concept_tesla_engineer] “ sich auf den Bau neuer Lokomotiven konzentrieren, die Ihren „ [GetBuildingType('building_usu_railway_line').GetName] “-Gebäuden einen Bonus verschaffen. Dies verursacht zusätzliche Kosten #n #! für Ihr Land.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]" #deepl:4167404043
 MR_MECHANICAL_ENGINEER_LOCOMOTIVES_TRIGGER_TT: "#default_text Mindestens ein „ [GetBuildingType('building_usu_railway_line').GetName] “ der Stufe 1 oder höher verfügt nicht über alle fünf Fortbewegungsfähigkeiten [Concept('concept_modifier','$concept_modifiers$')].#!" #deepl:1121565009
 MR_CIVIL_ENGINEER_RAILWAY_BUTTON_TT: "#T Eisenbahnprojekt#!\n Konzentrieren Sie sich bei „ [concept_tesla_engineer] “ auf die Verbesserung der „ [GetBuildingType('building_usu_railway_line').GetName] “ in [GetPlayer.GetName]. Sie können dabei Bundesstaaten priorisieren, und die Eisenbahnen in diesen Bundesstaaten erhalten die „ $tesla_modernized_railway_lines_building_modifier_with_tooltip$ “ [concept_modifier], was die „ [concept_throughput] “ des Gebäudes verbessert.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]" #deepl:2311210078
 MR_CIVIL_ENGINEER_RAILWAY_TRIGGER_TT: "#default_text [GetPlayer.GetName] hat eine [GetBuildingType('building_usu_railway_line').GetName] ohne die $tesla_modernized_railway_lines_building_modifier_with_tooltip$ [concept_modifier] .#!" #deepl:3743543419
