 # Journals
 je_gaudi_railway_project_reason: "[concept_tesla_civil_engineer] ’iniz[GetPlayer.MakeScope.GetCountry.GetCustom('gaudi_dr_engineer_type')], [GetPlayer.GetName] adresindeki [GetBuildingType('building_usu_railway_line').GetName] hatlarını modernize etmek üzere bir proje başlattı. Proje her ay ilerleme kaydedecek. İlerleme her [JournalEntry.GetTotalGoalValue|V0] adresine ulaştığında, mevcut altyapısı en az olan eyalet $tesla_modernized_railway_lines_building_modifier_with_tooltip$ [concept_modifier] adresinden yararlanacak.\n\n Güncel aylık ilerleme: #underline #tooltip:[GetRawTextTooltipTag('gaudi_monthly_civil_research_progress_tt')] [GetPlayer.MakeScope.GetVariable('gaudi_monthly_civil_engineering_progress_var').GetValue|2+] #!#!" #deepl:3888691188
 je_gaudi_new_locomotives_project_reason: "[concept_tesla_mechanical_engineer][GetPlayer.MakeScope.GetCountry.GetCustom('gaudi_dr_engineer_type')] , [GetPlayer.GetName] için yeni lokomotif türleri üretmek üzere yorulmak bilmeden çalışıyor. Proje her ay ilerleme kaydedecek. Her ay ilerleme [JournalEntry.GetTotalGoalValue|V0] seviyesine ulaştığında, yeni lokomotifler [GetBuildingType('building_usu_railway_line').GetName] adresindeki bir binaya yerleştirilecek. En yüksek seviyeye sahip bina, modifiyeri ilk olarak alacak. Tüm binalar bu modifiye ediciye sahip olduğunda ilerleme çubuğu sıfırlanacaktır.\nToplamda kazanılabilecek 5 modifiye edici bulunmaktadır. Her yeni modifiye edici için ilerleme çubuğunun yeniden dolması gerekmektedir.\n\n Güncel aylık ilerleme durumu: #underline #tooltip:[GetRawTextTooltipTag('gaudi_monthly_mechanical_research_progress_tt')] [GetPlayer.MakeScope.GetVariable('gaudi_monthly_mechanical_engineering_progress_var').GetValue|2+] #!#!" #deepl:4274698333
 gaudi_railways_with_new_locomotives_tt: "Tüm [GetPlayer.GetAdjective] [GetBuildingType('building_usu_railway_line').GetName] adresindeki binalarda 5 modifiye edici bulunur.\n- 1. modifiye ediciye sahip binalar: [GetPlayer.MakeScope.GetVariable('gaudi_num_railway_buildings_with_first_modifier_var').GetValue|+0] / [GetPlayer.MakeScope.GetVariable('gaudi_num_railway_buildings_var').GetValue|V0]\n - 2. modifiye ediciye sahip binalar: [GetPlayer.MakeScope.GetVariable('gaudi_num_railway_buildings_with_second_modifier_var').GetValue|+0] / [GetPlayer.MakeScope.GetVariable('gaudi_num_railway_buildings_var').GetValue|V0]\n - 3. modifiye ediciye sahip binalar: [GetPlayer.MakeScope.GetVariable('gaudi_num_railway_buildings_with_third_modifier_var').GetValue|+0] / [GetPlayer.MakeScope.GetVariable('gaudi_num_railway_buildings_var').GetValue|V0]\n - 4. modifiye ediciye sahip binalar: [GetPlayer.MakeScope.GetVariable('gaudi_num_railway_buildings_with_fourth_modifier_var').GetValue|+0] / [GetPlayer.MakeScope.GetVariable('gaudi_num_railway_buildings_var').GetValue|V0]\n - 5. modifiye ediciye sahip binalar: [GetPlayer.MakeScope.GetVariable('gaudi_num_railway_buildings_with_modifiers_var').GetValue|+0] / [GetPlayer.MakeScope.GetVariable('gaudi_num_railway_buildings_var').GetValue|V0]" #deepl:2623591430
 
 # Tooltips
 MR_CIVIL_ENGINEER_INFRASTRUCTURE_TRIGGER_TT: "#default_text Ülkenizdeki herhangi bir eyalet, gerekli altyapının tamamına sahip değildir [Concept('concept_modifier','$concept_modifiers$')]. Bir eyaletin demiryolu değiştiricisini alabilmesi için [GetBuildingType('building_usu_railway_line').GetName] adresine sahip olması gerekir.#!" #deepl:3199767471
 MR_MECHANICAL_ENGINEER_LOCOMOTIVES_BUTTON_TT: "#T Yeni Lokomotifler Geliştirin#!\n [concept_tesla_engineer] 'larınızın, [GetBuildingType('building_usu_railway_line').GetName] binalarınıza bonus sağlayacak yeni lokomotiflerin yapımına odaklanmalarını sağlayın. Bu, ülkenize #n giderleri#! ekleyecektir.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]" #deepl:4167404043
 MR_MECHANICAL_ENGINEER_LOCOMOTIVES_TRIGGER_TT: "#default_text Seviye 1 veya daha yüksek en az bir [GetBuildingType('building_usu_railway_line').GetName] ’in beş lokomotifinin tamamı mevcut değildir [Concept('concept_modifier','$concept_modifiers$')].#!" #deepl:1121565009
 MR_CIVIL_ENGINEER_RAILWAY_BUTTON_TT: "#T Demiryolu Projesi#!\n [concept_tesla_engineer] adresindeki çalışmanızı, [GetPlayer.GetName] adresindeki [GetBuildingType('building_usu_railway_line').GetName] 'yi iyileştirmeye odaklayın. Eyaletlere öncelik verebileceksiniz ve bu eyaletlerdeki demiryolları, binanın [concept_throughput] değerini artıran $tesla_modernized_railway_lines_building_modifier_with_tooltip$ [concept_modifier] 'yi elde edecektir.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]" #deepl:2311210078
 MR_CIVIL_ENGINEER_RAILWAY_TRIGGER_TT: "#default_text [GetPlayer.GetName] adresinde, $tesla_modernized_railway_lines_building_modifier_with_tooltip$ [concept_modifier] adresi bulunmayan bir [GetBuildingType('building_usu_railway_line').GetName] sayfası bulunmaktadır.#!" #deepl:3743543419
