 # Journals
 je_gaudi_railway_project_reason: "[concept_tesla_civil_engineer] ([GetPlayer.MakeScope.GetCountry.GetCustom('gaudi_dr_engineer_type')] )가 [GetPlayer.GetName] 에 있는 [GetBuildingType('building_usu_railway_line').GetName] 노선을 현대화하는 프로젝트를 시작했습니다. 이 프로젝트는 매달 진행 상황을 업데이트할 예정입니다. 진행 상황이 [JournalEntry.GetTotalGoalValue|V0] 에 도달할 때마다, 이용 가능한 인프라가 가장 부족한 주에 $tesla_modernized_railway_lines_building_modifier_with_tooltip$ ( [concept_modifier])가 수여됩니다.\n\n 현재 월간 진행 상황: #underline #tooltip:[GetRawTextTooltipTag('gaudi_monthly_civil_research_progress_tt')] [GetPlayer.MakeScope.GetVariable('gaudi_monthly_civil_engineering_progress_var').GetValue|2+] #!#!" #deepl:3888691188
 je_gaudi_new_locomotives_project_reason: "[concept_tesla_mechanical_engineer] ([GetPlayer.MakeScope.GetCountry.GetCustom('gaudi_dr_engineer_type')] ) 팀은 [GetPlayer.GetName] 을 위해 새로운 유형의 기관차를 제작하기 위해 끊임없이 노력하고 있습니다. 이 프로젝트는 매월 진행도가 쌓입니다. 매월 진행도가 [JournalEntry.GetTotalGoalValue|V0] 에 도달하면 새로운 기관차가 [GetBuildingType('building_usu_railway_line').GetName] 건물에 배치됩니다. 레벨이 가장 높은 건물이 가장 먼저 수정자를 획득합니다. 모든 건물이 해당 수정자를 획득하면 진행률 바가 초기화됩니다.\n획득할 수 있는 수정자는 총 5개입니다. 새로운 수정자를 획득하려면 진행률을 다시 채워야 합니다.\n\n 현재 월간 진행률: #underline #tooltip:[GetRawTextTooltipTag('gaudi_monthly_mechanical_research_progress_tt')] [GetPlayer.MakeScope.GetVariable('gaudi_monthly_mechanical_engineering_progress_var').GetValue|2+] #!#!" #deepl:4274698333
 gaudi_railways_with_new_locomotives_tt: "모든 [GetPlayer.GetAdjective] [GetBuildingType('building_usu_railway_line').GetName] 건물에는 5가지 수정자가 적용되어 있습니다.\n- 첫 번째 수정자가 적용된 건물: [GetPlayer.MakeScope.GetVariable('gaudi_num_railway_buildings_with_first_modifier_var').GetValue|+0] / [GetPlayer.MakeScope.GetVariable('gaudi_num_railway_buildings_var').GetValue|V0]\n - 두 번째 수정자가 적용된 건물: [GetPlayer.MakeScope.GetVariable('gaudi_num_railway_buildings_with_second_modifier_var').GetValue|+0] / [GetPlayer.MakeScope.GetVariable('gaudi_num_railway_buildings_var').GetValue|V0]\n - 세 번째 수정자가 적용된 건물: [GetPlayer.MakeScope.GetVariable('gaudi_num_railway_buildings_with_third_modifier_var').GetValue|+0] / [GetPlayer.MakeScope.GetVariable('gaudi_num_railway_buildings_var').GetValue|V0]\n - 네 번째 수정자가 적용된 건물: [GetPlayer.MakeScope.GetVariable('gaudi_num_railway_buildings_with_fourth_modifier_var').GetValue|+0] / [GetPlayer.MakeScope.GetVariable('gaudi_num_railway_buildings_var').GetValue|V0]\n - 다섯 번째 수정자가 적용된 건물: [GetPlayer.MakeScope.GetVariable('gaudi_num_railway_buildings_with_modifiers_var').GetValue|+0] / [GetPlayer.MakeScope.GetVariable('gaudi_num_railway_buildings_var').GetValue|V0]" #deepl:2623591430
 
 # Tooltips
 MR_CIVIL_ENGINEER_INFRASTRUCTURE_TRIGGER_TT: "#default_text 귀국의 어느 주라도 필요한 인프라를 모두 갖추고 있지는 않습니다 [Concept('concept_modifier','$concept_modifiers$')]. 주가 철도 수정자를 얻으려면 [GetBuildingType('building_usu_railway_line').GetName] 가 필요합니다.#!" #deepl:3199767471
 MR_MECHANICAL_ENGINEER_LOCOMOTIVES_BUTTON_TT: "#T 새로운 기관차 개발하기#!\n [concept_tesla_engineer] 가 [GetBuildingType('building_usu_railway_line').GetName] 건물에 보너스를 제공하는 새로운 기관차 제작에 집중하도록 하세요. 이렇게 하면 #n 비용이#! 국가에 추가됩니다.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]" #deepl:4167404043
 MR_MECHANICAL_ENGINEER_LOCOMOTIVES_TRIGGER_TT: "#default_text 레벨 1 이상인 ‘ [GetBuildingType('building_usu_railway_line').GetName] ’ 중 적어도 하나는 5가지 운동 기관을 모두 갖추지 못했습니다 [Concept('concept_modifier','$concept_modifiers$')].#!" #deepl:1121565009
 MR_CIVIL_ENGINEER_RAILWAY_BUTTON_TT: "#T 철도 프로젝트#!\n [concept_tesla_engineer] 를 통해 [GetPlayer.GetName] 에 있는 [GetBuildingType('building_usu_railway_line').GetName] 를 개선하는 데 집중하세요. 주별로 우선순위를 정할 수 있으며, 해당 주의 철도에는 건물의 [concept_throughput] 를 향상시키는 $tesla_modernized_railway_lines_building_modifier_with_tooltip$ [concept_modifier] 가 적용됩니다.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]" #deepl:2311210078
 MR_CIVIL_ENGINEER_RAILWAY_TRIGGER_TT: "#default_text [GetPlayer.GetName] 에는 $tesla_modernized_railway_lines_building_modifier_with_tooltip$ [concept_modifier] 가 포함되지 않은 [GetBuildingType('building_usu_railway_line').GetName] 가 있습니다.#!" #deepl:3743543419
