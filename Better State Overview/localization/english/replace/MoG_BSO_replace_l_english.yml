l_english:
 state_market_access_price_impact: "[concept_market_access_price_impact]"
 state_market_access_price_impact_desc: "The the maximum influence that [concept_market_access] can have on the [concept_local_price] of a [concept_good]. It is a measure of how well-informed a [concept_state] is about the other merchants within its [concept_market]. Final prices are determined by whichever market access value is lower."
 STATE_MARKET_STATUS: "[State.GetMarket.GetName]\n[SelectLocalization(LessThan_CFixedPoint(State.GetInfrastructureBalance, '(CFixedPoint)0'), 'WARNING', '')][State.GetMarketAccess|%v0]"
 STATE_MARKET_CAPITAL_STATUS: "#yellow [State.GetMarket.GetOwner.GetAdjectiveNoFormatting]#!\n[concept_market_capital]"
 STATE_MARKET_CAPITAL_STATUS_CONDENSED: "[State.GetMarketAccess|%v0]"
 state_tax_collection_mult: "Collection"  # Literally just to stop the box expanding.
 STATE_CONSTRUCTION_CONDENSED: "[SelectLocalization(GreaterThan_int32(Country.GetNumBuildingsUnderConstructionInState(State.Self), '(int32)0'), 'STATE_CONSTRUCTION_ACTIVE', '')][AddTextIf(And(GreaterThan_int32(Country.GetNumBuildingsUnderConstructionInState(State.Self), '(int32)0'),GreaterThan_int32(Country.GetNumBuildingsInConstructionQueueInState(State.Self), '(int32)0')),'\n')][SelectLocalization(GreaterThan_int32(Country.GetNumBuildingsInConstructionQueueInState(State.Self), '(int32)0'), 'STATE_CONSTRUCTION_IN_QUEUE', '')]"   # Fix adding extra spacing that annoys me
 STATE_CONSTRUCTION_ACTIVE: "[Country.GetNumBuildingsUnderConstructionInState(State.Self)|v] active"
 STATE_CONSTRUCTION_IN_QUEUE: "[Country.GetNumBuildingsInConstructionQueueInState(State.Self)|v] queued"
 STATE_OBSTINANCE_CONDENSED: "#b [State.GetObstinance|%R1]#! \n([State.GetNumObstinanceSupporters|vD] @population!)"